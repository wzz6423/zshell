[package]
name = "zshell_remote"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "zshell-server"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zshell_alacritty = { path = "../mac/Vendor/alacritty-bridge", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }
