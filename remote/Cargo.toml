[package]
name = "zshell_remote"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "zshell-server"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zshell_alacritty = { path = "../mac/Vendor/alacritty-bridge" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
