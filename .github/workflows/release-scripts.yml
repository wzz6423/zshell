name: Release Scripts

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Skip Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-skip-gate
        with:
          workflow-name: Release Scripts
          github-token: ${{ github.token }}

  shell:
    name: Check Shell Scripts
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # zsh, not bash: build-alacritty-bridge.sh uses `${=ARCHS}` word splitting,
      # which bash rejects. The shebang decides which parser gets the file.
      - name: Syntax check release and build scripts
        run: |
          for script in scripts/*.sh; do
            case "$(head -n 1 "$script")" in
              "#!/bin/zsh") zsh -n "$script" ;;
              "#!/usr/bin/env bash") bash -n "$script" ;;
              *) echo "Unsupported shell in $script" >&2; exit 1 ;;
            esac
          done

      - name: Check the dev icon generator
        run: python3 -m py_compile scripts/make-dev-icon.py

      - name: Remove compile artifacts
        if: always()
        run: rm -rf scripts/__pycache__

  typecheck:
    name: Typecheck Release Scripts
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The root package is a workspace, so this installs web/ too — which is
      # where the TypeScript compiler the root tsconfig.json needs comes from.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck scripts/
        run: bunx tsc --noEmit

      - name: Remove installed dependencies
        if: always()
        run: rm -rf node_modules web/node_modules
