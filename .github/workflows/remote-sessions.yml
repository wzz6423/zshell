name: Remote Sessions

on:
  pull_request:
    branches:
      - main
      - "publish-v*"
  push:
    branches:
      - main
      - "publish-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Skip Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      relevant: ${{ steps.gate.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        uses: ./.github/actions/ci-skip-gate
        with:
          workflow-name: Remote Sessions
          github-token: ${{ github.token }}

  server:
    name: Remote Server (${{ matrix.platform }})
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.relevant != 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: macOS
            runner: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use an isolated build directory
        shell: bash
        run: printf 'CARGO_TARGET_DIR=%s/remote-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check the Rust toolchain
        run: cargo --version && rustc --version

      - name: Run protocol and real PTY regressions
        run: cargo test --locked --manifest-path remote/Cargo.toml

      - name: Build the host executable
        run: cargo build --locked --release --manifest-path remote/Cargo.toml

      - name: Exercise the production CLI and stdio bridge
        if: runner.os == 'macOS'
        run: python3 remote/tests/test_cli.py --binary "$CARGO_TARGET_DIR/release/zshell-server"

      - name: Exercise the CLI and different-UID socket boundary on Linux
        if: runner.os == 'Linux'
        run: sudo -n python3 remote/tests/test_cli.py --binary "$CARGO_TARGET_DIR/release/zshell-server" --require-other-uid

      - name: Exercise native Agent hooks and persistent exact conversation resume
        run: python3 remote/tests/test_agents.py --binary "$CARGO_TARGET_DIR/release/zshell-server"

      - name: Exercise shared Codex conversation ownership
        run: python3 remote/tests/test_shared_codex.py --binary "$CARGO_TARGET_DIR/release/zshell-server"

      - name: Remove build artifacts
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/remote-target"
