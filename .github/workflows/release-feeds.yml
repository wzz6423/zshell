name: Release Feeds

# This gate verifies canonical three-architecture feeds. The publisher separately
# verifies downloaded package hashes/signatures on both hosts before declaring completion.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag the feeds must offer, for example v0.1.0.
        required: true
        type: string
      attempts:
        description: How many times to poll before failing.
        required: false
        default: 1
        type: number

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  feeds:
    name: Verify Signed Sparkle Feeds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the stable release tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RELEASE_TAG:-}}"
          case "$tag" in
            updates | update-release)
              echo "::notice::$tag is a permanent feed release; the versioned publish verifies canonical feeds."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable vX.Y.Z release tags are supported."
            exit 1
          fi
          {
            echo "skip=false"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Probe Gitee access from this runner
        id: gitee
        if: steps.target.outputs.skip != 'true'
        run: |
          set -euo pipefail
          hosts=gitee,github
          for url in \
            https://gitee.com/api/v5/repos/wzz6423/zshell \
            https://gitee.com/wzz6423/zshell/releases/download/update-release/appcast.xml; do
            code="$(curl --location --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 25 "$url" || true)"
            case "$code" in
              000 | 403 | 429)
                hosts=github
                echo "::warning::Gitee access is blocked or rate limited from this runner (HTTP $code). This CI run verifies GitHub only; the release operator must still run publish-release.ts --verify successfully against both hosts."
                break
                ;;
            esac
          done
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          if [ "$hosts" = github ]; then
            echo 'Gitee was not verified by this runner. Successful local verification of both hosts is still required.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify all release assets and signed canonical feeds
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          HOSTS: ${{ steps.gitee.outputs.hosts }}
          ATTEMPTS: ${{ inputs.attempts || 10 }}
          INTERVAL: "60"
        run: |
          set -euo pipefail
          version_names="$RUNNER_TEMP/version-release-assets.txt"
          feed_names="$RUNNER_TEMP/feed-release-assets.txt"
          gitee_json="$RUNNER_TEMP/gitee-release.json"

          verify() {
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '.assets[].name' > "$version_names" || return 1
            ruby .github/scripts/appcast-feeds.rb verify-assets \
              --tag "$TAG" --layout version < "$version_names" || return 1

            if [[ ",$HOSTS," == *,gitee,* ]]; then
              curl --fail --location --silent --show-error --max-time 60 \
                "https://gitee.com/api/v5/repos/wzz6423/zshell/releases/tags/$TAG" \
                --output "$gitee_json" || return 1
              jq -er '.assets | arrays | .[].name' "$gitee_json" > "$version_names" || return 1
              ruby .github/scripts/appcast-feeds.rb verify-assets \
                --tag "$TAG" --layout version < "$version_names" || return 1
              curl --fail --location --silent --show-error --max-time 60 \
                https://gitee.com/api/v5/repos/wzz6423/zshell/releases/tags/update-release \
                --output "$gitee_json" || return 1
              jq -er '.assets | arrays | .[].name' "$gitee_json" > "$feed_names" || return 1
              ruby .github/scripts/appcast-feeds.rb verify-assets \
                --tag "$TAG" --layout feed < "$feed_names" || return 1
            fi

            ruby .github/scripts/appcast-feeds.rb verify --tag "$TAG" --hosts "$HOSTS" || return 1
            # Anonymous access must work for every architecture's installation package.
            for host in ${HOSTS//,/ }; do
              for architecture in arm64 x86_64 universal; do
                curl --fail --location --silent --show-error --head --max-time 30 --output /dev/null \
                  "https://$host.com/wzz6423/zshell/releases/download/$TAG/zshell-$TAG-macOS-$architecture.dmg" || return 1
              done
            done
          }

          attempt=1
          while [ "$attempt" -le "$ATTEMPTS" ]; do
            echo "Attempt $attempt of $ATTEMPTS"
            if verify; then
              printf 'Verified 15 required version assets per host, signed three-architecture canonical feeds, and public DMG access on %s for %s. Package byte/hash verification is performed separately by the publisher.\n' \
                "$HOSTS" "$TAG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$ATTEMPTS" ]; then
              sleep "$INTERVAL"
            fi
          done
          echo "::error::The release assets or signed canonical feeds do not serve $TAG after $ATTEMPTS attempts."
          exit 1

      - name: Remove downloaded asset listings
        if: always()
        run: rm -f "$RUNNER_TEMP/version-release-assets.txt" "$RUNNER_TEMP/feed-release-assets.txt" "$RUNNER_TEMP/gitee-release.json"
