name: Web Pages

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages keeps one deployment in flight, and cancelling one midway leaves the site
# serving a half-updated mix of old and new assets.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # bun.lock lives at the root: web/ is a workspace member, not its own install.
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      # The site renders at build time, so the changelog's contributor count is
      # fetched here rather than per request; the token only lifts the rate limit.
      - name: Build website
        working-directory: web
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run build

      # Prerendering writes the deployable site to dist/client. dist/server is the
      # bundle it renders against and is deliberately left behind. CNAME and the
      # (empty, hence -f) .nojekyll come from public/: without them Pages drops the
      # custom domain and hides the `_`-prefixed asset chunks.
      - name: Verify build artifacts
        working-directory: web
        run: |
          test -s dist/client/index.html
          test -s dist/client/zh/index.html
          test -s dist/client/docs/index.html
          test -s dist/client/changelog/index.html
          test -s dist/client/api/search
          test -s dist/client/api/release
          test -s dist/client/api/docs/en
          test -s dist/client/api/docs/zh
          test -s dist/client/CNAME
          test -f dist/client/.nojekyll
          test -n "$(ls -A dist/client/assets)"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Clean up build artifacts
        if: always()
        run: rm -rf web/dist web/.source node_modules web/node_modules
