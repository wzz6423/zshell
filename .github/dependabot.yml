version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directories:
      - /mac
      - /web
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      bun-dependencies:
        patterns:
          - "*"

  # The Alacritty backend's bridge. The Xcode build phase passes --locked, so a
  # bump has to land in Cargo.lock to take effect.
  - package-ecosystem: cargo
    directory: /mac/Vendor/alacritty-bridge
    schedule:
      interval: monthly
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      cargo-dependencies:
        patterns:
          - "*"

# No swift entry: Sparkle, STTextView-Plugin-Neon, PierreDiffsSwift and FuzzyMatch
# are SwiftPM dependencies declared inside mac/zshell.xcodeproj, and Dependabot only
# reads a Package.swift. Bump those from Xcode's Packages list by hand.
